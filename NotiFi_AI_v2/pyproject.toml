[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notifi-ai-v2"
version = "0.1.0"
description = "Motion-calibrated CSI action, risk, and pose research"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.2",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["notifi_ai_v2*"]
