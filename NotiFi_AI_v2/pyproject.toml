[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notifi-ai-v2"
version = "0.2.0"
description = "Full-support calibrated CSI action, risk, and pose inference"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "torch>=2.2",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["notifi_ai_v2*", "notifi_pose*"]
